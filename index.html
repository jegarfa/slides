<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diapositivas de Astronomía</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    h1 { text-align: center; }
    
    /* Contenedor de Pestañas */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-top: 2rem;
    }
    .tab-button {
      padding: 0.75rem 1.5rem;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    /* Contenido de Pestañas */
    .tab-content {
      display: none;
      padding-top: 1.5rem;
    }
    .tab-content.active {
      display: block;
    }
    
    /* Lista de Diapositivas */
    .slide-list {
      list-style: none;
      padding: 0;
    }
    .slide-list li {
      margin-bottom: 0.75rem;
    }
    .slide-list a {
      display: block;
      padding: 1rem;
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .slide-list a:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <h1>Diapositivas de Cursos</h1>

  <div class="tabs">
    <button class="tab-button active" onclick="switchTab(event, 'intro')">Introducción a la Astronomía</button>
    <button class="tab-button" onclick="switchTab(event, 'galext')">Astronomía Galáctica y Extragaláctica</button>
  </div>

  <!-- Pestaña 1: Intro Astro -->
  <div id="intro" class="tab-content active">
    <ul class="slide-list">
      <li><a href="IntroAstro/sesion-01-intro.html" target="_blank">Sesión 1: Introducción</a></li>
      <li><a href="IntroAstro/sesion-02-intro.html" target="_blank">Sesión 2: Conceptos Básicos</a></li>
      <li><a href="IntroAstro/sesion-03-medir.html" target="_blank">Sesión 3: Mediciones en Astronomía</a></li>
    </ul>
  </div>

  <!-- Pestaña 2: Galáctica y Extragaláctica -->
  <div id="galext" class="tab-content">
    <ul class="slide-list">
      <li><a href="GalExAstro/sesion-01-intro.html" target="_blank">Sesión 1: Introducción a Galaxias</a></li>
      <li><a href="GalExAstro/sesion-02-intro.html" target="_blank">Sesión 2: Estructura Galáctica</a></li>
      <li><a href="GalExAstro/sesion-03-medir.html" target="_blank">Sesión 3: Escala de Distancias</a></li>
    </ul>
  </div>

  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
